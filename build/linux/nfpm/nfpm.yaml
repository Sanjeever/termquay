# Linux 包元数据与运行依赖，操作入口见 docs/development.md。
# version 通过 scripts/version.mjs 从 frontend/package.json 同步。

name: "termquay"
arch: ${GOARCH}
platform: "linux"
version: "1.4.3"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "TermQuay 远程连接工作台"
vendor: "TermQuay contributors"
homepage: "https://github.com/Sanjeever/termquay"
license: "Apache-2.0"
release: "1"

contents:
  - src: "./bin/termquay"
    dst: "/usr/local/bin/termquay"
  - src: "./build/linux/icon-128.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/termquay.png"
  - src: "./build/linux/termquay.desktop"
    dst: "/usr/share/applications/termquay.desktop"

# 默认 GTK4 / WebKitGTK 6.0 运行库；不同包格式使用下方依赖名。
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
