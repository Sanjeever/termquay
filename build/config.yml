# Wails 开发与构建资源配置，操作入口见 docs/development.md。
# 版本通过 scripts/version.mjs 同步；修改其他 info 或 fileAssociations 后，
# 用 wails3 task common:update:build-assets 更新资源。
# 生成可能覆盖手工定制，执行前后检查平台资源 diff。
version: '3'

info:
  companyName: "TermQuay"
  productName: "TermQuay"
  productIdentifier: "com.termquay.app"
  description: "TermQuay 远程连接工作台"
  copyright: "Copyright 2026 TermQuay contributors"
  comments: "开源远程连接工作台"
  version: "1.3.3"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # 跟踪通过 //wails:include 嵌入的 JS/TS 资源。
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
      # 标准前端任务等待 FRONTEND_DEVSERVER_URL 就绪后再启动桌面，端口由项目任务传入。
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

# 当前未启用文件关联；启用后需重新生成平台资源。
fileAssociations:

# Wails 模板附加数据。
other:
  - name: My Other Data
