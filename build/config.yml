# Wails development/build resources: docs/development.md#development-commands.
# Sync versions through scripts/version.mjs. After other info/fileAssociations changes,
# run pnpm task common:update:build-assets and inspect the generated platform diff
# for overwritten packaging customizations.
version: '3'

info:
  companyName: "TermQuay"
  productName: "TermQuay"
  productIdentifier: "com.termquay.app"
  description: "TermQuay 远程连接工作台"
  copyright: "Copyright 2026 TermQuay contributors"
  comments: "开源远程连接工作台"
  version: "1.4.4"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # 跟踪通过 //wails:include 嵌入的 JS/TS 资源。
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
      # Frontend tasks receive VITE_PORT; keep the RDP origin aligned (docs/development.md#environment).
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

# 当前未启用文件关联；启用后需重新生成平台资源。
fileAssociations:

# Wails 模板附加数据。
other:
  - name: My Other Data
