# Resource generation and version synchronization are documented in
# docs/development.zh-CN.md#构建与本地打包 and docs/development.md#versions-and-releases.
version: '3'

info:
  companyName: "TermQuay"
  productName: "TermQuay"
  productIdentifier: "com.termquay.app"
  description: "TermQuay 远程连接工作台"
  copyright: "Copyright 2026 TermQuay contributors"
  comments: "开源远程连接工作台"
  version: "1.4.8"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch resources embedded through //wails:include.
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
      # Frontend tasks receive VITE_PORT; keep the RDP origin aligned (docs/development.md#environment).
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:

other:
  - name: My Other Data
